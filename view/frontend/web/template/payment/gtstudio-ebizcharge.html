<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>

    <div class="payment-method-content">
        <!-- ko if: isSandbox() -->
        <div class="message warning" role="alert">
            <span data-bind="i18n: 'Test Mode — no real charges will be made.'"></span>
        </div>
        <!-- /ko -->

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <!-- Animated card visual (vendored card.js 2.5.4 — see js/lib/VENDORED.md) -->
        <div class="gtstudio-card-visual-wrapper"
             data-bind="attr: {id: getCode() + '-card-visual'}, afterRender: mountCardVisual"></div>

        <form class="form gtstudio-ebizcharge-card-form"
              data-bind="attr: {id: getCode() + '-form'}"
              novalidate="novalidate">
            <fieldset class="fieldset payment items ccard" data-bind="attr: {id: 'payment_form_' + getCode()}">
                <legend class="legend">
                    <span data-bind="i18n: 'Credit Card Information'"></span>
                </legend>
                <input type="hidden"
                       name="payment[cc_exp_month_year]"
                       data-bind="attr: {id: getCode() + '_expiration_visual'}"/>

                <div class="field name required">
                    <label data-bind="attr: {for: getCode() + '_cc_owner'}" class="label">
                        <span data-bind="i18n: 'Name on Card'"></span>
                    </label>
                    <div class="control">
                        <input type="text"
                               name="payment[cc_owner]"
                               class="input-text"
                               value=""
                               autocomplete="cc-name"
                               data-bind="attr: {id: getCode() + '_cc_owner', title: $t('Name on Card')}"/>
                    </div>
                </div>

                <div class="field type required">
                    <label data-bind="attr: {for: getCode() + '_cc_type'}" class="label">
                        <span data-bind="i18n: 'Credit Card Type'"></span>
                    </label>
                    <div class="control">
                        <select name="payment[cc_type]"
                                class="select select-ccard required-entry"
                                data-bind="attr: {id: getCode() + '_cc_type', 'data-container': getCode() + '-cc-type', autocomplete: off},
                                           options: getCcAvailableTypesValues(),
                                           optionsValue: 'value', optionsText: 'cc_type_label',
                                           optionsCaption: $t('-- Please Select --'),
                                           value: creditCardType,
                                           enable: isActive($parents)">
                        </select>
                    </div>
                </div>

                <div class="field number required">
                    <label data-bind="attr: {for: getCode() + '_cc_number'}" class="label">
                        <span data-bind="i18n: 'Credit Card Number'"></span>
                    </label>
                    <div class="control">
                        <input type="text"
                               name="payment[cc_number]"
                               class="input-text"
                               value=""
                               autocomplete="off"
                               inputmode="numeric"
                               data-bind="attr: {id: getCode() + '_cc_number', title: $t('Credit Card Number'), 'data-container': getCode() + '-cc-number'},
                                          enable: isActive($parents),
                                          value: creditCardNumber,
                                          valueUpdate: 'keyup'"/>
                    </div>
                </div>

                <div class="field date required" data-bind="attr: {id: getCode() + '_cc_type_exp_div'}">
                    <label data-bind="attr: {for: getCode() + '_expiration'}" class="label">
                        <span data-bind="i18n: 'Expiration Date'"></span>
                    </label>
                    <div class="control">
                        <div class="fields group group-2">
                            <div class="field no-label month">
                                <div class="control">
                                    <select name="payment[cc_exp_month]"
                                            class="select select-month"
                                            data-bind="attr: {id: getCode() + '_expiration', 'data-container': getCode() + '-cc-month', autocomplete: off},
                                                       enable: isActive($parents),
                                                       options: getCcMonthsValues(),
                                                       optionsValue: 'value', optionsText: 'month',
                                                       optionsCaption: $t('Month'),
                                                       value: creditCardExpMonth">
                                    </select>
                                </div>
                            </div>
                            <div class="field no-label year">
                                <div class="control">
                                    <select name="payment[cc_exp_year]"
                                            class="select select-year"
                                            data-bind="attr: {id: getCode() + '_expiration_yr', 'data-container': getCode() + '-cc-year', autocomplete: off},
                                                       enable: isActive($parents),
                                                       options: getCcYearsValues(),
                                                       optionsValue: 'value', optionsText: 'year',
                                                       optionsCaption: $t('Year'),
                                                       value: creditCardExpYear">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field cvv required" data-bind="attr: {id: getCode() + '_cc_type_cvv_div'}">
                    <label data-bind="attr: {for: getCode() + '_cc_cid'}" class="label">
                        <span data-bind="i18n: 'Card Verification Number'"></span>
                    </label>
                    <div class="control _with-tooltip">
                        <input type="text"
                               name="payment[cc_cid]"
                               class="input-text cvv"
                               value=""
                               autocomplete="off"
                               inputmode="numeric"
                               data-bind="attr: {id: getCode() + '_cc_cid', title: $t('Card Verification Number'), 'data-container': getCode() + '-cc-cvv'},
                                          enable: isActive($parents),
                                          value: creditCardVerificationNumber"/>
                        <div class="field-tooltip toggle">
                            <span class="field-tooltip-action action-cvv" tabindex="0" data-toggle="dropdown"
                                  data-bind="mageInit: {'dropdown':{'activeClass': '_active'}}, attr: {title: $t('What is this?')}">
                                <span data-bind="i18n: 'What is this?'"></span>
                            </span>
                            <div class="field-tooltip-content"
                                 data-target="dropdown">
                                <img data-bind="attr: {src: getCvvImageUrl(), alt: $t('Card Verification Number Visual Reference'), title: $t('Card Verification Number Visual Reference')}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <!-- ko if: isVaultEnabled() -->
            <div class="field choice gtstudio-save-card">
                <input type="checkbox"
                       name="vault[is_enabled]"
                       class="checkbox"
                       data-bind="attr: {id: getCode() + '_enable_vault'}, checked: vaultEnabler.isActivePaymentTokenEnabler"/>
                <label data-bind="attr: {for: getCode() + '_enable_vault'}" class="label">
                    <span data-bind="i18n: 'Save this card for next time'"></span>
                </label>
            </div>
            <!-- /ko -->
        </form>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="click: placeOrder, attr: {title: $t('Place Order')},
                                   css: {disabled: !isPlaceOrderActionAllowed()},
                                   enable: (getCode() == isChecked())">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
