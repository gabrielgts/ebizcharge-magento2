<div class="payment-method gtstudio-ebizcharge-vault" data-bind="css: {'_active': (getId() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getId()}, value: getId(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getId()}" class="label">
            <span class="cc-type" data-bind="text: getCardType()"></span>
            <span class="cc-mask" data-bind="text: '•••• ' + getMaskedCard()"></span>
            <span class="cc-exp" data-bind="text: ' (' + getExpirationDate() + ')'"></span>
        </label>
    </div>

    <div class="payment-method-content">
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="click: placeOrder,
                                   attr: {title: $t('Place Order')},
                                   css: {disabled: !isPlaceOrderActionAllowed()},
                                   enable: (getId() == isChecked())">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
