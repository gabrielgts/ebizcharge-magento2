<div class="payment-method gtstudio-ebizcharge-ach" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>

    <div class="payment-method-content">
        <!-- ko if: isSandbox() -->
        <div class="message warning" role="alert">
            <span data-bind="i18n: 'Test Mode — no real charges will be made.'"></span>
        </div>
        <!-- /ko -->

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <form class="form" data-bind="attr: {id: getCode() + '-form'}" novalidate="novalidate">
            <fieldset class="fieldset payment items ach" data-bind="attr: {id: 'payment_form_' + getCode()}">
                <legend class="legend">
                    <span data-bind="i18n: 'Bank Account Information'"></span>
                </legend>

                <div class="field type required">
                    <label data-bind="attr: {for: getCode() + '_ach_type'}" class="label">
                        <span data-bind="i18n: 'Account Type'"></span>
                    </label>
                    <div class="control">
                        <select name="payment[ach_type]"
                                class="select required-entry"
                                data-bind="attr: {id: getCode() + '_ach_type'},
                                           options: getAccountTypeOptions(),
                                           optionsValue: 'value', optionsText: 'label',
                                           value: achType">
                        </select>
                    </div>
                </div>

                <div class="field routing required">
                    <label data-bind="attr: {for: getCode() + '_ach_routing'}" class="label">
                        <span data-bind="i18n: 'Routing Number'"></span>
                    </label>
                    <div class="control">
                        <input type="text"
                               name="payment[ach_routing]"
                               class="input-text required-entry validate-digits validate-length minimum-length-9 maximum-length-9"
                               value=""
                               autocomplete="off"
                               inputmode="numeric"
                               maxlength="9"
                               data-bind="attr: {id: getCode() + '_ach_routing', title: $t('Routing Number')},
                                          value: achRouting,
                                          valueUpdate: 'keyup'"/>
                    </div>
                </div>

                <div class="field account required">
                    <label data-bind="attr: {for: getCode() + '_ach_account'}" class="label">
                        <span data-bind="i18n: 'Account Number'"></span>
                    </label>
                    <div class="control">
                        <input type="text"
                               name="payment[ach_account]"
                               class="input-text required-entry validate-digits validate-length minimum-length-4 maximum-length-17"
                               value=""
                               autocomplete="off"
                               inputmode="numeric"
                               maxlength="17"
                               data-bind="attr: {id: getCode() + '_ach_account', title: $t('Account Number')},
                                          value: achAccount,
                                          valueUpdate: 'keyup'"/>
                    </div>
                </div>
            </fieldset>

            <!-- ko if: canOfferSaveAccount() -->
            <div class="field choice gtstudio-save-account">
                <input type="checkbox"
                       name="payment[ach_save]"
                       class="checkbox"
                       data-bind="attr: {id: getCode() + '_ach_save'}, checked: saveAccount"/>
                <label data-bind="attr: {for: getCode() + '_ach_save'}" class="label">
                    <span data-bind="i18n: 'Save this bank account for next time'"></span>
                </label>
            </div>
            <!-- /ko -->
        </form>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="click: placeOrder, attr: {title: $t('Place Order')},
                                   css: {disabled: !isPlaceOrderActionAllowed()},
                                   enable: (getCode() == isChecked())">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
